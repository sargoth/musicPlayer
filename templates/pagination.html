{% if is_paginated %}
    <nav class="flex items-center justify-between border-t border-slate-800 px-4 py-3 sm:px-6 mt-8">
        <div class="hidden sm:block">
            <p class="text-sm text-slate-400">
                Showing page <span class="font-medium text-slate-200">{{ page_obj.number }}</span> of
                <span class="font-medium text-slate-200">{{ page_obj.paginator.num_pages }}</span>
            </p>
        </div>
        <div class="flex flex-1 justify-between sm:justify-end gap-2">
            {% if page_obj.has_previous %}
                <a href="?page={{ page_obj.previous_page_number }}"
                   class="relative inline-flex items-center rounded-md bg-slate-800 px-3 py-2 text-xs font-semibold text-slate-200 hover:bg-slate-700 transition">
                    Previous
                </a>
            {% else %}
                <span class="relative inline-flex items-center rounded-md bg-slate-900 px-3 py-2 text-xs font-semibold text-slate-600 cursor-not-allowed">
                    Previous
                </span>
            {% endif %}

            {% if page_obj.has_next %}
                <a href="?page={{ page_obj.next_page_number }}"
                   class="relative inline-flex items-center rounded-md bg-indigo-600 px-3 py-2 text-xs font-semibold text-white hover:bg-indigo-500 transition">
                    Next
                </a>
            {% else %}
                <span class="relative inline-flex items-center rounded-md bg-slate-900 px-3 py-2 text-xs font-semibold text-slate-600 cursor-not-allowed">
                    Next
                </span>
            {% endif %}
        </div>
    </nav>
{% endif %}
