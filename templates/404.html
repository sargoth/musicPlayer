{% extends 'base.html' %}

{% block title %}
    404 - Page Not Found
{% endblock %}

{% block content %}
    <div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full shadow-xl">
            <h1 class="text-7xl font-extrabold text-indigo-500 mb-2">404</h1>
            <h2 class="text-2xl font-bold text-white mb-3">Page Not Found</h2>
            <p class="text-slate-400 text-sm mb-6">
                Sorry, the page, album, or playlist you are looking for doesn't exist or has been moved.
            </p>
            <a href="{% url 'home' %}"
               class="inline-block bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-6 py-2.5 rounded-lg transition shadow-md hover:shadow-indigo-500/25">
                Return to Safety
            </a>
        </div>
    </div>
{% endblock %}
