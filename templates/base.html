<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}musicPlayer | Community Audio Hub{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/@hotwired/turbo@8.0.4/dist/turbo.es2017-esm.js"></script>
</head>
<body class="flex flex-col min-h-full pb-28">
<header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800/80 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">

        <!-- Logo -->
        <a href="{% url 'home' %}"
           class="flex items-center gap-2 font-bold text-xl text-indigo-400 hover:text-indigo-300 transition flex-shrink-0">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <span>musicPlayer</span>
        </a>

        <!-- Global Search Input -->
        <form action="{% url 'catalog:search' %}" method="GET" class="flex-1 max-w-md">
            <div class="relative">
                <input type="search"
                       name="q"
                       value="{{ request.GET.q|default:'' }}"
                       placeholder="Search tracks, artists, albums..."
                       class="w-full bg-slate-800/80 text-sm text-slate-100 placeholder-slate-400 border border-slate-700/60 rounded-full pl-10 pr-4 py-1.5 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2" fill="none"
                     stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>
        </form>

        <!-- Navigation Links -->
        <nav class="flex items-center gap-6 text-sm font-medium flex-shrink-0">
            <a href="{% url 'catalog:list_artists' %}" class="hover:text-indigo-400 transition">Artists</a>
            <a href="{% url 'catalog:list_albums' %}" class="hover:text-indigo-400 transition">Albums</a>
            <a href="{% url 'playlists:list_playlists' %}" class="hover:text-indigo-400 transition">Playlists</a>
            <a href="{% url 'catalog:list_genres' %}" class="hover:text-indigo-400 transition">Genres</a>
        </nav>
    </div>
</header>
<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
</main>

{% include 'footer.html' %}

<script>
    // 1. Safe Global State Initialization (Prevents Turbo redeclaration crashes)
    window.currentQueue = window.currentQueue || [];
    window.currentQueueIndex = window.currentQueueIndex || 0;
    window.isShuffle = window.isShuffle || false;

    // Fast aliases for local script scope using 'var'
    var currentQueue = window.currentQueue;
    var currentQueueIndex = window.currentQueueIndex;

    // 2. Play a Track (integrates with contextual queue when available)
    function playTrack(audioUrl, title, artist, coverUrl, trackId) {
        // If track is already in the current active queue, jump to its index
        let foundIndex = -1;
        if (window.currentQueue && window.currentQueue.length > 0) {
            foundIndex = window.currentQueue.findIndex(t => (trackId && t.id === trackId) || (audioUrl && t.track_url === audioUrl));
        }

        if (foundIndex !== -1) {
            window.currentQueueIndex = foundIndex;
            currentQueueIndex = foundIndex;
            loadAndPlayTrack(window.currentQueue[foundIndex]);
            return;
        }

        // Try loading queue from contextual tracks JSON in the current DOM
        const jsonScript = document.getElementById('album-tracks-json') ||
            document.getElementById('playlist-tracks-json') ||
            document.getElementById('artist-tracks-json') ||
            document.getElementById('home-tracks-json') ||
            document.getElementById('tracks-json');
        if (jsonScript) {
            try {
                const pageTracks = JSON.parse(jsonScript.textContent);
                if (Array.isArray(pageTracks) && pageTracks.length > 0) {
                    const pageIndex = pageTracks.findIndex(t => (trackId && t.id === trackId) || (audioUrl && t.track_url === audioUrl));
                    if (pageIndex !== -1) {
                        window.currentQueue = pageTracks;
                        window.currentQueueIndex = pageIndex;
                        currentQueue = window.currentQueue;
                        currentQueueIndex = pageIndex;
                        loadAndPlayTrack(window.currentQueue[pageIndex]);
                        return;
                    }
                }
            } catch (e) {
                console.error("Error parsing track JSON:", e);
            }
        }

        // Fallback: single-track queue
        window.currentQueue = [{
            track_url: audioUrl,
            title: title,
            artist: artist,
            cover_url: coverUrl,
            id: trackId
        }];
        window.currentQueueIndex = 0;
        currentQueue = window.currentQueue;
        currentQueueIndex = window.currentQueueIndex;

        loadAndPlayTrack(window.currentQueue[0]);
    }

    // 3. Play an Entire Sequence (Album / Playlist)
    function playAlbumQueue(tracksList) {
        if (!tracksList || tracksList.length === 0) return;

        window.currentQueue = tracksList;
        window.currentQueueIndex = 0;
        currentQueue = window.currentQueue;
        currentQueueIndex = window.currentQueueIndex;

        loadAndPlayTrack(window.currentQueue[0]);
    }

    // 4. Core Track Loader & API Execution
    function loadAndPlayTrack(track) {
        if (!track) return;

        const audio = document.getElementById('global-audio-element');
        const titleElem = document.getElementById('player-title');
        const artistElem = document.getElementById('player-artist');
        const coverContainer = document.getElementById('player-cover');

        if (titleElem) titleElem.textContent = track.title;
        if (artistElem) artistElem.textContent = track.artist || 'Unknown Artist';

        if (coverContainer) {
            if (track.cover_url) {
                coverContainer.innerHTML = `<img src="${track.cover_url}" alt="${track.title}" class="w-full h-full object-cover">`;
            } else {
                coverContainer.innerHTML = `
                    <svg class="w-6 h-6 text-neutral-600" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>`;
            }
        }

        if (audio) {
            audio.src = track.track_url;
            audio.play().catch(function (error) {
                console.warn("Playback interrupted or waiting for user interaction:", error);
            });
        }

        if (track.id) {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');

            fetch(`/tracks/${track.id}/play/`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken,
                    "X-Requested-With": "XMLHttpRequest",
                    "Accept": "text/html; turbo-stream, text/plain, */*",
                },
            })
                .then(response => {
                    if (response.headers.get("Content-Type")?.includes("turbo-stream")) {
                        return response.text().then(html => Turbo.renderStreamMessage(html));
                    }
                })
                .catch(error => {
                    console.error("Failed to increment play count:", error);
                });
        }
    }

    // Expose helpers globally
    window.loadAndPlayTrack = loadAndPlayTrack;
    window.playAlbumQueue = playAlbumQueue;
    window.playTrack = playTrack;

    // 5. Shared Next Track Handler (Fallback if not provided by player footer)
    if (!window.handleNextTrack) {
        window.handleNextTrack = function () {
            const queue = window.currentQueue;
            let index = window.currentQueueIndex;

            if (!queue || queue.length === 0) return;

            if (window.isShuffle) {
                index = Math.floor(Math.random() * queue.length);
            } else if (index < queue.length - 1) {
                index++;
            } else {
                index = 0; // Wrap around to start of queue
            }

            window.currentQueueIndex = index;
            currentQueueIndex = index;
            loadAndPlayTrack(queue[index]);
        };
    }

    // 6. Audio End Listener
    document.addEventListener('DOMContentLoaded', () => {
        const audio = document.getElementById('global-audio-element');
        if (audio && !audio.dataset.hasEndedListener) {
            audio.dataset.hasEndedListener = "true";
            audio.addEventListener('ended', () => {
                if (typeof window.handleNextTrack === 'function') {
                    window.handleNextTrack();
                }
            });
        }
    });
</script>
<script>
    document.addEventListener('turbo:load', function () {

        const urlInput = document.getElementById('id_track_url');
        const durationInput = document.getElementById('id_duration_in_seconds');

        if (urlInput && durationInput) {

            urlInput.addEventListener('input', function () {
                const audioUrl = this.value.trim();

                if (audioUrl) {
                    const tempAudio = new Audio();

                    tempAudio.addEventListener('loadedmetadata', function () {
                        durationInput.value = Math.round(tempAudio.duration);
                    });

                    tempAudio.addEventListener('error', function () {
                        console.error("Failed to load metadata.");
                    });

                    tempAudio.src = audioUrl;
                } else {
                    durationInput.value = "";
                }
            });
        }
    });
</script>
<script>
    document.addEventListener('turbo:load', () => {
        const searchInput = document.querySelector('header input[type="search"]');
        if (!searchInput) return;

        let debounceTimer;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                if (e.target.value.trim().length >= 2 || e.target.value.trim().length === 0) {
                    e.target.form.requestSubmit();
                }
            }, 500); // 500ms delay after typing stops
        });
    });
</script>
</body>
</html>
