<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}musicPlayer | Community Audio Hub{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="https://unpkg.com/@hotwired/turbo@8.0.4/dist/turbo.es2017-esm.js"></script>
</head>
<body class="flex flex-col min-h-full pb-28">
<header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <a href="{% url 'home' %}"
           class="flex items-center gap-2 font-bold text-xl text-indigo-400 hover:text-indigo-300 transition">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
            </svg>
            <span>musicPlayer</span>
        </a>

        <nav class="flex items-center gap-6 text-sm font-medium">
            <a href="{% url 'catalog:list_artists' %}" class="hover:text-indigo-400 transition">Artists</a>
            <a href="{% url 'catalog:list_albums' %}" class="hover:text-indigo-400 transition">Albums</a>
            <a href="{% url 'playlists:list_playlists' %}" class="hover:text-indigo-400 transition">Playlists</a>
            <a href="{% url 'catalog:list_genres' %}" class="hover:text-indigo-400 transition">Genres</a>
        </nav>
    </div>
</header>
<main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    {% block content %}{% endblock %}
</main>
<div id="global-music-player" data-turbo-permanent
     class="fixed bottom-0 left-0 right-0 z-50 bg-slate-900 border-t border-slate-800 p-4 shadow-2xl">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
        <div class="flex items-center gap-3 w-full md:w-1/4">
            <div id="player-cover"
                 class="w-12 h-12 bg-slate-800 rounded flex items-center justify-center overflow-hidden">
                <svg class="w-6 h-6 text-slate-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </div>
            <div class="truncate">
                <div id="player-title" class="font-medium text-sm text-slate-200 truncate">Select a track to play</div>
                <div id="player-artist" class="text-xs text-slate-400 truncate">Global Audio Library</div>
            </div>
        </div>
        <div class="w-full md:w-2/4">
            <audio id="global-audio-element" controls class="w-full h-10 accent-indigo-500">
                <source id="audio-source" src="" type="audio/mpeg">
                Your browser does not support HTML5 audio.
            </audio>
        </div>

        <div class="hidden md:block w-1/4 text-right text-xs text-slate-500">
            Community Jukebox
        </div>

    </div>
</div>
<script>
    function playTrack(audioUrl, title, artist, coverUrl, trackId) {
        const audio = document.getElementById('global-audio-element');
        const titleElem = document.getElementById('player-title');
        const artistElem = document.getElementById('player-artist');
        const coverContainer = document.getElementById('player-cover');

        titleElem.textContent = title;
        artistElem.textContent = artist || 'Unknown Artist';

        if (coverUrl) {
            coverContainer.innerHTML = `<img src="${coverUrl}" alt="${title}" class="w-full h-full object-cover">`;
        }

        audio.src = audioUrl;
        audio.play().catch(function (error) {
            console.warn("Playback interrupted or waiting for user interaction:", error);
        });

        // Trigger background count increment if a track ID is provided
        if (trackId) {
            const csrfToken = document.querySelector('meta[name="csrf-token"]')?.getAttribute('content');

            fetch(`/tracks/${trackId}/play/`, {
                method: "POST",
                headers: {
                    "X-CSRFToken": csrfToken,
                    "X-Requested-With": "XMLHttpRequest",
                },
            }).catch(error => {
                console.error("Failed to increment play count:", error);
            });
        }
    }
</script>
<script>
    document.addEventListener('turbo:load', function () {

        const urlInput = document.getElementById('id_track_url');
        const durationInput = document.getElementById('id_duration_in_seconds');

        if (urlInput && durationInput) {

            urlInput.addEventListener('input', function () {
                const audioUrl = this.value.trim();

                if (audioUrl) {
                    const tempAudio = new Audio();

                    tempAudio.addEventListener('loadedmetadata', function () {
                        durationInput.value = Math.round(tempAudio.duration);
                    });

                    tempAudio.addEventListener('error', function () {
                        console.error("Failed to load metadata.");
                    });

                    tempAudio.src = audioUrl;
                } else {
                    durationInput.value = "";
                }
            });
        }
    });
</script>
</body>
</html>
