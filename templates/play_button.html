<button type="button"
        {% if onclick_action %}
            onclick="{{ onclick_action }}"
        {% else %}
            onclick="playTrack('{{ track.final_url }}', '{{ track.title|escapejs }}', '{{ track.album.artist.name|escapejs }}', '{{ track.album.cover_image_url }}', {{ track.pk }})"
        {% endif %}
        class="{{ button_class|default:'w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center transition' }}">
    {% if button_icon %}{{ button_icon }}{% endif %}
    {% if button_text %}<span>{{ button_text }}</span>{% endif %}
</button>
