<!-- YouTube Music Styled Player Footer -->
<footer id="global-music-player" data-turbo-permanent
        class="fixed bottom-0 left-0 right-0 z-50 bg-[#212121] border-t border-neutral-800 text-white select-none shadow-2xl">

    <!-- Global Audio Element -->
    <audio id="global-audio-element" class="hidden" preload="metadata"></audio>

    <!-- Top Progress / Scrubber Bar -->
    <div id="progress-container"
         class="group relative w-full h-1 bg-neutral-700/60 hover:h-2 transition-all cursor-pointer">
        <!-- Buffered / Background line -->
        <div class="absolute inset-0 bg-neutral-700/60"></div>

        <!-- Played Progress Bar Fill -->
        <div id="progress-bar-fill"
             class="absolute top-0 left-0 h-full bg-indigo-600 pointer-events-none transition-none"
             style="width: 0%;"></div>

        <!-- Scrubber Thumb -->
        <div id="progress-thumb"
             class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-3 h-3 bg-indigo-600 rounded-full opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow"
             style="left: 0%;"></div>

        <!-- Interactive Slider Overlay -->
        <input type="range" id="progress-slider" min="0" max="100" value="0" step="0.1"
               aria-label="Seek progress"
               class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10 m-0 p-0">
    </div>

    <!-- Main Player Bar Content -->
    <div class="max-w-7xl mx-auto px-4 h-16 sm:h-18 flex items-center justify-between gap-2 sm:gap-4">

        <!-- Left Column: Controls -->
        <div class="flex items-center gap-1 sm:gap-3 shrink-0">
            <!-- Previous Track Button -->
            <button id="btn-prev-track" type="button" title="Previous"
                    class="p-2 text-neutral-400 hover:text-white transition rounded-full hover:bg-white/10 active:scale-95 focus:outline-none">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                </svg>
            </button>

            <!-- Play / Pause Button -->
            <button id="btn-play-pause" type="button" title="Play"
                    class="w-10 h-10 rounded-full hover:bg-white/10 text-neutral-400 flex items-center justify-center transition active:scale-95 focus:outline-none">
                <svg id="icon-play" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M7 5v14l11-7z"/>
                </svg>
                <svg id="icon-pause" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
                    <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
                </svg>
            </button>

            <!-- Next Track Button -->
            <button id="btn-next-track" type="button" title="Next"
                    class="p-2 text-neutral-400 hover:text-white transition rounded-full hover:bg-white/10 active:scale-95 focus:outline-none">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                </svg>
            </button>

            <!-- Time Display -->
            <div class="hidden sm:flex items-center text-xs text-neutral-400 font-mono tracking-tight ml-1 select-none">
                <span id="time-current">0:00</span>
                <span class="mx-1">/</span>
                <span id="time-total">0:00</span>
            </div>
        </div>

        <!-- Center Column: Track Metadata -->
        <div class="flex items-center gap-3 min-w-0 max-w-xs sm:max-w-md lg:max-w-lg flex-1 mx-2 sm:mx-6 justify-center sm:justify-start">
            <div id="player-cover"
                 class="w-11 h-11 sm:w-12 sm:h-12 rounded bg-neutral-800 flex-shrink-0 overflow-hidden flex items-center justify-center border border-neutral-700/50 shadow">
                <svg class="w-6 h-6 text-neutral-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </div>

            <div class="truncate text-left">
                <div id="player-title" class="font-medium text-sm text-white truncate">
                    Select a track to play
                </div>
                <div id="player-artist" class="text-xs text-neutral-400 truncate">
                    Global Audio Library
                </div>
            </div>
        </div>

        <!-- Right Column: Volume & Shuffle Controls -->
        <div class="flex items-center gap-2 sm:gap-4 shrink-0">
            <!-- Shuffle Button -->
            <button id="btn-shuffle" type="button" title="Shuffle"
                    class="p-2 text-neutral-400 hover:text-white transition rounded-full hover:bg-white/10 active:scale-95 focus:outline-none relative">
                <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
                </svg>
                <span id="shuffle-indicator"
                      class="hidden absolute bottom-1 left-1/2 -translate-x-1/2 w-1 h-1 bg-indigo-600 rounded-full"></span>
            </button>

            <!-- Volume Section -->
            <div class="flex items-center gap-2 group/volume">
                <button id="btn-volume" type="button" title="Mute/Unmute"
                        class="p-2 text-neutral-400 hover:text-white transition rounded-full hover:bg-white/10 active:scale-95 focus:outline-none">
                    <svg id="icon-vol-high" class="w-5 h-5 fill-current" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                    <svg id="icon-vol-low" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                    </svg>
                    <svg id="icon-vol-muted" class="w-5 h-5 fill-current hidden" viewBox="0 0 24 24">
                        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                    </svg>
                </button>

                <div class="relative w-16 sm:w-24 flex items-center">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1"
                           aria-label="Volume slider"
                           class="w-full h-1 bg-neutral-700 rounded-lg appearance-none cursor-pointer accent-indigo-600 focus:outline-none">
                </div>
            </div>
        </div>

    </div>
</footer>

<script>
    (function () {
        let isShuffleActive = false;
        let isSeeking = false;
        let previousVolume = 1;

        function getAudio() {
            return document.getElementById('global-audio-element');
        }

        function getQueue() {
            if (Array.isArray(window.currentQueue)) return window.currentQueue;
            if (typeof currentQueue !== 'undefined' && Array.isArray(currentQueue)) return currentQueue;
            return [];
        }

        function getQueueIndex() {
            if (typeof window.currentQueueIndex === 'number') return window.currentQueueIndex;
            if (typeof currentQueueIndex === 'number') return currentQueueIndex;
            return 0;
        }

        function setQueueIndex(idx) {
            window.currentQueueIndex = idx;
            if (typeof currentQueueIndex !== 'undefined') {
                try { currentQueueIndex = idx; } catch (e) {}
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !isFinite(seconds) || seconds < 0) {
                return "0:00";
            }
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function updatePlayPauseUI(isPlaying) {
            const iconPlay = document.getElementById('icon-play');
            const iconPause = document.getElementById('icon-pause');
            const btn = document.getElementById('btn-play-pause');

            if (!iconPlay || !iconPause || !btn) return;

            if (isPlaying) {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
                btn.setAttribute('title', 'Pause');
            } else {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
                btn.setAttribute('title', 'Play');
            }
        }

        function updateVolumeUI(volume, isMuted) {
            const iconHigh = document.getElementById('icon-vol-high');
            const iconLow = document.getElementById('icon-vol-low');
            const iconMuted = document.getElementById('icon-vol-muted');
            const volumeSlider = document.getElementById('volume-slider');

            if (!iconHigh || !iconLow || !iconMuted || !volumeSlider) return;

            const effectiveVolume = isMuted ? 0 : volume;
            volumeSlider.value = effectiveVolume;

            const percent = effectiveVolume * 100;
            volumeSlider.style.background = `linear-gradient(to right, #4f46e5 ${percent}%, #525252 ${percent}%)`;

            iconHigh.classList.add('hidden');
            iconLow.classList.add('hidden');
            iconMuted.classList.add('hidden');

            if (isMuted || effectiveVolume === 0) {
                iconMuted.classList.remove('hidden');
            } else if (effectiveVolume < 0.5) {
                iconLow.classList.remove('hidden');
            } else {
                iconHigh.classList.remove('hidden');
            }
        }

        function togglePlayPause() {
            const audio = getAudio();
            if (!audio) return;

            if (audio.paused) {
                if (audio.src && audio.src !== window.location.href) {
                    audio.play().catch(err => console.warn("Playback prevented or interrupted:", err));
                } else {
                    const queue = getQueue();
                    if (queue && queue.length > 0) {
                        const track = queue[getQueueIndex()];
                        const playFn = (typeof loadAndPlayTrack === 'function') ? loadAndPlayTrack : window.loadAndPlayTrack;
                        if (typeof playFn === 'function') {
                            playFn(track);
                        }
                    }
                }
            } else {
                audio.pause();
            }
        }

        function handleNextTrack() {
            const audio = getAudio();
            const queue = getQueue();
            if (queue && queue.length > 0) {
                const currIdx = getQueueIndex();
                const shuffle = isShuffleActive || Boolean(window.isShuffle);
                if (shuffle) {
                    let nextIndex = currIdx;
                    if (queue.length > 1) {
                        do {
                            nextIndex = Math.floor(Math.random() * queue.length);
                        } while (nextIndex === currIdx);
                    }
                    setQueueIndex(nextIndex);
                } else {
                    if (currIdx < queue.length - 1) {
                        setQueueIndex(currIdx + 1);
                    } else {
                        setQueueIndex(0);
                    }
                }

                const nextTrack = queue[getQueueIndex()];
                const playFn = (typeof loadAndPlayTrack === 'function') ? loadAndPlayTrack : window.loadAndPlayTrack;
                if (typeof playFn === 'function') {
                    playFn(nextTrack);
                }
            } else if (audio && audio.duration && isFinite(audio.duration)) {
                audio.currentTime = audio.duration;
            }
        }

        function handlePrevTrack() {
            const audio = getAudio();
            if (audio && audio.currentTime > 3) {
                audio.currentTime = 0;
                return;
            }

            const queue = getQueue();
            if (queue && queue.length > 0) {
                const currIdx = getQueueIndex();
                if (currIdx > 0) {
                    setQueueIndex(currIdx - 1);
                } else {
                    setQueueIndex(queue.length - 1);
                }

                const prevTrack = queue[getQueueIndex()];
                const playFn = (typeof loadAndPlayTrack === 'function') ? loadAndPlayTrack : window.loadAndPlayTrack;
                if (typeof playFn === 'function') {
                    playFn(prevTrack);
                }
            } else if (audio) {
                audio.currentTime = 0;
            }
        }

        window.handleNextTrack = handleNextTrack;
        window.handlePrevTrack = handlePrevTrack;

        function toggleShuffle() {
            isShuffleActive = !isShuffleActive;
            window.isShuffle = isShuffleActive;
            const btnShuffle = document.getElementById('btn-shuffle');
            const indicator = document.getElementById('shuffle-indicator');

            if (btnShuffle && indicator) {
                if (isShuffleActive) {
                    btnShuffle.classList.add('text-indigo-600');
                    btnShuffle.classList.remove('text-neutral-400');
                    indicator.classList.remove('hidden');
                } else {
                    btnShuffle.classList.remove('text-indigo-600');
                    btnShuffle.classList.add('text-neutral-400');
                    indicator.classList.add('hidden');
                }
            }
        }

        function toggleMute() {
            const audio = getAudio();
            if (!audio) return;

            if (audio.muted || audio.volume === 0) {
                audio.muted = false;
                audio.volume = previousVolume > 0 ? previousVolume : 0.8;
            } else {
                previousVolume = audio.volume;
                audio.muted = true;
            }
            updateVolumeUI(audio.volume, audio.muted);
        }

        // Progress Bar & Safe Seek Handlers
        function setupProgressEvents(audio) {
            const progressSlider = document.getElementById('progress-slider');
            const progressFill = document.getElementById('progress-bar-fill');
            const progressThumb = document.getElementById('progress-thumb');
            const timeCurrent = document.getElementById('time-current');
            const timeTotal = document.getElementById('time-total');

            if (!progressSlider || !progressFill || !progressThumb) return;

            audio.addEventListener('timeupdate', function () {
                if (!isSeeking && audio.duration && isFinite(audio.duration) && audio.duration > 0) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = `${percent}%`;
                    progressThumb.style.left = `${percent}%`;
                    progressSlider.value = percent;
                    if (timeCurrent) timeCurrent.textContent = formatTime(audio.currentTime);
                }
            });

            audio.addEventListener('loadedmetadata', function () {
                if (audio.duration && isFinite(audio.duration)) {
                    if (timeTotal) timeTotal.textContent = formatTime(audio.duration);
                    if (timeCurrent) timeCurrent.textContent = formatTime(audio.currentTime);
                }
            });

            audio.addEventListener('durationchange', function () {
                if (audio.duration && isFinite(audio.duration)) {
                    if (timeTotal) timeTotal.textContent = formatTime(audio.duration);
                }
            });

            // Seeking interaction logic with safe duration check
            function applySeek() {
                if (audio.duration && isFinite(audio.duration) && audio.duration > 0) {
                    const percent = parseFloat(progressSlider.value);
                    const targetTime = (percent / 100) * audio.duration;

                    if (isFinite(targetTime)) {
                        audio.currentTime = targetTime;
                        progressFill.style.width = `${percent}%`;
                        progressThumb.style.left = `${percent}%`;
                        if (timeCurrent) timeCurrent.textContent = formatTime(targetTime);
                    }
                }
            }

            progressSlider.addEventListener('input', function () {
                isSeeking = true;
                applySeek();
            });

            progressSlider.addEventListener('change', function () {
                applySeek();
                isSeeking = false;
            });
        }

        function setupVolumeEvents(audio) {
            const volumeSlider = document.getElementById('volume-slider');
            if (!volumeSlider) return;

            volumeSlider.addEventListener('input', function () {
                const vol = parseFloat(volumeSlider.value);
                audio.volume = vol;
                audio.muted = (vol === 0);
                if (vol > 0) previousVolume = vol;
                updateVolumeUI(audio.volume, audio.muted);
            });

            audio.addEventListener('volumechange', function () {
                updateVolumeUI(audio.volume, audio.muted);
            });
        }

        function initPlayer() {
            const audio = getAudio();
            if (!audio) return;

            if (!audio.dataset.statusSyncBound) {
                audio.dataset.statusSyncBound = "true";
                audio.addEventListener('play', () => updatePlayPauseUI(true));
                audio.addEventListener('pause', () => updatePlayPauseUI(false));
            }

            const btnPlayPause = document.getElementById('btn-play-pause');
            const btnNext = document.getElementById('btn-next-track');
            const btnPrev = document.getElementById('btn-prev-track');
            const btnShuffle = document.getElementById('btn-shuffle');
            const btnVolume = document.getElementById('btn-volume');

            if (btnPlayPause && !btnPlayPause.dataset.bound) {
                btnPlayPause.dataset.bound = "true";
                btnPlayPause.addEventListener('click', togglePlayPause);
            }

            if (btnNext && !btnNext.dataset.bound) {
                btnNext.dataset.bound = "true";
                btnNext.addEventListener('click', handleNextTrack);
            }

            if (btnPrev && !btnPrev.dataset.bound) {
                btnPrev.dataset.bound = "true";
                btnPrev.addEventListener('click', handlePrevTrack);
            }

            if (btnShuffle && !btnShuffle.dataset.bound) {
                btnShuffle.dataset.bound = "true";
                btnShuffle.addEventListener('click', toggleShuffle);
            }

            if (btnVolume && !btnVolume.dataset.bound) {
                btnVolume.dataset.bound = "true";
                btnVolume.addEventListener('click', toggleMute);
            }

            if (window.isShuffle !== undefined) {
                isShuffleActive = window.isShuffle;
            }
            const indicator = document.getElementById('shuffle-indicator');
            if (btnShuffle && indicator) {
                if (isShuffleActive) {
                    btnShuffle.classList.add('text-indigo-600');
                    btnShuffle.classList.remove('text-neutral-400');
                    indicator.classList.remove('hidden');
                } else {
                    btnShuffle.classList.remove('text-indigo-600');
                    btnShuffle.classList.add('text-neutral-400');
                    indicator.classList.add('hidden');
                }
            }

            if (!audio.dataset.footerListenersBound) {
                audio.dataset.footerListenersBound = "true";
                setupProgressEvents(audio);
                setupVolumeEvents(audio);
            }

            updatePlayPauseUI(!audio.paused && audio.currentTime > 0);
            updateVolumeUI(audio.volume, audio.muted);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPlayer);
        } else {
            initPlayer();
        }

        document.addEventListener('turbo:load', initPlayer);
    })();
</script>
