{% extends 'base.html' %}
{% block content %}

    <div class="max-w-2xl mx-auto mt-12 mb-20">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-extrabold text-white mb-2">Add New Artist</h1>
            <p class="text-slate-400">Expand the community library by adding a new artist.</p>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-xl">
            <form method="post" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}
                {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-300 mb-2">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.help_text %}
                            <p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="pt-6 mt-6 border-t border-slate-800 flex items-center justify-end gap-4">
                    <a href="{% url 'catalog:list_albums' %}"
                       class="text-sm font-medium text-slate-400 hover:text-white transition px-4 py-2">
                        Cancel
                    </a>
                    <button type="submit"
                            class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition shadow-lg shadow-indigo-600/30">
                        Create Artist
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
