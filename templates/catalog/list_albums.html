{% extends 'base.html' %}
{% block content %}
<!-- Page Header -->
<div class="mb-8 flex items-end justify-between">
    <div>
        <h1 class="text-3xl font-extrabold text-white mb-2">Albums</h1>
        <p class="text-slate-400">Browse the complete album collection.</p>
    </div>
    <!-- Optional Add Button -->
    <a href="{% url 'catalog:create_album' %}" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-md transition shadow-lg shadow-indigo-500/20">
        + Add Album
    </a>
</div>

<!-- Albums Grid -->
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
    {% for album in albums %}
    <!-- Album Card -->
    <a href="{% url 'catalog:album_detail' album.pk %}" class="group bg-slate-900 border border-slate-800 rounded-xl p-4 hover:border-indigo-500/50 hover:bg-slate-800/50 transition flex flex-col shadow-sm hover:shadow-xl">

        <!-- Square Image Container -->
        <div class="aspect-square w-full rounded-lg overflow-hidden bg-slate-800 mb-4 shadow-md">
            <img src="{{ album.cover_image_url }}"
                 alt="{{ album.title }}"
                 class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
        </div>

        <!-- Album Info -->
        <h3 class="font-bold text-base text-white mb-1 truncate group-hover:text-indigo-400 transition">
            {{ album.title }}
        </h3>

        <p class="text-sm text-slate-400 truncate">
            {{ album.artist.name }}
        </p>
    </a>
    {% empty %}
    <div class="col-span-full py-16 flex flex-col items-center justify-center bg-slate-900/50 border border-slate-800 border-dashed rounded-2xl text-center">
        <svg class="w-16 h-16 text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
        </svg>
        <h3 class="text-lg font-medium text-white mb-1">No albums found</h3>
        <p class="text-slate-400 text-sm">There are no albums in the catalog yet.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
